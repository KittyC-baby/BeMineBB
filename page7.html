<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Future Dreams</title>

    <link rel="stylesheet" href="page7.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Background -->

    <div class="background"></div>

    <!-- Floating Stars -->

    <div id="stars"></div>

    <!-- Title -->

    <div class="title">

        <h1>Our Future Dreams ✨</h1>

        <p>
            Every little firefly is carrying one dream...
            Touch them one by one. 💛
        </p>

    </div>

    <!-- Firefly Jar -->

    <div class="jar-container">

        <div class="jar">

            <!-- Fireflies -->

            <div class="firefly" data-id="0"></div>
            <div class="firefly" data-id="1"></div>
            <div class="firefly" data-id="2"></div>
            <div class="firefly" data-id="3"></div>
            <div class="firefly" data-id="4"></div>
            <div class="firefly" data-id="5"></div>

        </div>

    </div>

    <!-- Dream Card -->

    <div id="dreamCard" class="dream-card">

        <div class="dream-box">

            <h2>💛 A Little Dream</h2>

            <p id="dreamText"></p>

            <button id="closeDream">
                Catch another firefly ✨
            </button>

        </div>

    </div>

    <!-- Final Message -->

    <div id="finalMessage" class="final-message">

        <h2>❤️</h2>

        <p>

            Every dream becomes beautiful...

            <br><br>

            because you're in it. ✨

        </p>

    </div>

    <!-- Next Button -->

    <button id="nextBtn">

        Let's Keep Walking Together ❤️

    </button>

    <script src="page7.js"></script>

</body>

</html>
