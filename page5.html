<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Our Universe</title>

    <link rel="stylesheet" href="page5.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

</head>
<body>

    <!-- Background -->
    <div class="sky">

        <!-- Twinkling Stars -->
        <div id="stars"></div>

        <!-- Shooting Stars -->
        <div id="shooting-stars"></div>

        <!-- Main Star -->
        <div id="loveStar"></div>

    </div>


    <!-- Title -->
    <div class="title">

        <h1>Our Universe</h1>

        <p>
            Among countless stars...
            one shines brighter than all.
        </p>

    </div>


    <!-- Romantic Note -->
    <div id="popup" class="popup">

        <div class="popup-box">

            <h2>✨</h2>

            <p>

                The sky may be filled with countless stars...
                <br><br>

                but for me,
                only your light is enough
                to make my life brighter.

            </p>

            <button id="closePopup">
                Close
            </button>

        </div>

    </div>


    <!-- Next Button -->

    <div class="next-container">

        <button id="nextBtn">

            Let's Keep Walking Together ❤️

        </button>

    </div>


<script src="page5.js"></script>

</body>
</html>
